<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Yard Data</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef0f2;--panel:#fff;--ink:#1b2128;--muted:#5d6874;--line:#d5dade;--accent:#e0a100;--good:#1f7a4d;--good-soft:#dcefe4;--warn:#b4471d;--warn-soft:#f7e1d8}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--panel:#1d232a;--ink:#e6e9ec;--muted:#97a2ad;--line:#323a43;--accent:#f0b429;--good:#5cc392;--good-soft:#18352a;--warn:#f08a62;--warn-soft:#3d2219}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:16px}
h1{font:700 1.8rem/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 0;padding-bottom:12px;border-bottom:4px solid var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:28px 16px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--accent)}
button,.pick{font:700 1.15rem "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;border:0;border-radius:4px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#1b2128;display:inline-block}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{display:none}
ul{margin:0;padding-left:20px}
.msg{border-radius:6px;padding:10px 14px}
.msg.ok{background:var(--good-soft);color:var(--good)}
.msg.err{background:var(--warn-soft);color:var(--warn)}
a{color:var(--ink);font-weight:600}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Import yard data</h1>
  <div class="card">
    <div>Copies trailers, weights, employees and past days from your old Claude yard report into this site. Running it twice is safe: it never makes duplicates.</div>
    <label class="drop" id="drop">
      <div style="margin-bottom:12px">Drop <b>yard-data.json</b> here, or</div>
      <span class="pick">Choose file</span>
      <input type="file" id="file" accept=".json,application/json">
    </label>
    <div id="summary" hidden></div>
    <div><button id="go" disabled>Copy into the site</button></div>
    <div id="msg"></div>
  </div>
  <a href="./">← Back to the yard</a>
</div>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const say = (t, cls) => { $("msg").className = cls ? "msg " + cls : ""; $("msg").textContent = t; };
  let data = null, db = null;

  const cfg = (window.YARD_CONFIG || {}).firebase || {};
  const ready = (async () => {
    if (!window.firebase || !cfg.apiKey) throw new Error("This site's config.js isn't loaded.");
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    try { db.settings({ ignoreUndefinedProperties: true }); } catch (e) {}
    await firebase.auth().signInAnonymously();
  })();
  ready.catch(e => say("Couldn't connect to the yard database: " + (e.code || e.message), "err"));

  function read(file){
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !d.trailers || !Array.isArray(d.employees)) throw new Error("not a yard data file");
        data = d;
        const n = o => Object.keys(o || {}).length;
        const entries = Object.values(d.wsub || {}).reduce((s, w) => s + n(w.entries), 0);
        const inYard = Object.values(d.trailers).filter(t => t.status === "in").length;
        $("summary").hidden = false;
        $("summary").innerHTML = `<b>${file.name}</b> has:<ul>
          <li>${n(d.trailers)} trailers (${inYard} in the yard now)</li>
          <li>${n(d.weights)} weight records and ${entries} employee weight entries</li>
          <li>${d.employees.length} employees</li>
          <li>${n(d.snaps)} past days of the yard report</li></ul>`;
        $("go").disabled = false; say("");
      } catch (e) { data = null; $("go").disabled = true; say("That file isn't the yard data file. Pick yard-data.json.", "err"); }
    };
    r.readAsText(file);
  }
  $("file").addEventListener("change", e => e.target.files[0] && read(e.target.files[0]));
  const drop = $("drop");
  ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("on"); }));
  ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("on"); }));
  drop.addEventListener("drop", e => e.dataTransfer.files[0] && read(e.dataTransfer.files[0]));

  $("go").addEventListener("click", async () => {
    if (!data) return;
    $("go").disabled = true; say("Copying…");
    try {
      await ready;
      const writes = [];
      Object.entries(data.trailers || {}).forEach(([id, d]) => writes.push(["trailers/" + id, d]));
      Object.entries(data.weights || {}).forEach(([id, d]) => writes.push(["weights/" + id, d]));
      Object.entries(data.snaps || {}).forEach(([id, d]) => writes.push(["snaps/" + id, d]));
      Object.entries(data.wsub || {}).forEach(([uid, w]) => {
        if (w.doc) writes.push(["wsub/" + uid, w.doc]);
        Object.entries(w.entries || {}).forEach(([id, d]) => writes.push(["wsub/" + uid + "/entries/" + id, d]));
      });
      for (let i = 0; i < writes.length; i += 400) {
        const b = db.batch();
        writes.slice(i, i + 400).forEach(([path, d]) => b.set(db.doc(path), d));
        await b.commit();
        say(`Copying… ${Math.min(i + 400, writes.length)} of ${writes.length}`);
      }
      // employees: keep anyone already added on this site, add the rest
      const ref = db.doc("config/employees"), cur = await ref.get();
      const list = cur.exists && Array.isArray(cur.data().list) ? cur.data().list : [];
      const have = new Set(list.map(x => x.id));
      const added = data.employees.filter(x => !have.has(x.id));
      await ref.set({ list: [...list, ...added] });
      say(`Done. Copied ${writes.length} records and added ${added.length} employee${added.length === 1 ? "" : "s"}. Go back to the yard to see them.`, "ok");
    } catch (e) {
      say("Couldn't finish copying: " + (e.code || e.message) + ". Nothing is lost; you can try again.", "err");
      $("go").disabled = false;
    }
  });
})();
</script>
</body>
</html>
