<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
/* page reset (the Claude version got this from its host) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<script>window.GAS_INIT=<?!= init ?>;</script>
<title>Tire Clicker Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: floor tool. Workers get one big-target step at a time (rim → size → grade, each grade showing its trailer). Managers also get Trailers, Routing and Setup tabs. Tire-crayon yellow is the only accent; grade colors are a separate code. */
:root{
  --bg:#E9EAE6; --surface:#F7F7F4; --surface2:#DEE0DB; --ink:#1B1D1F; --muted:#5D625E; --line:#C9CCC6;
  --accent:#F2BC1B; --accent-ink:#1B1D1F; --danger:#B3402F; --ok:#2E7D5B; --warnbg:#FBEBD0;
  --g1:#2E7D5B; --g2:#2F69A8; --g3:#7A5AAE; --g4:#B8741A; --g5:#B3402F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141618; --surface:#1D2023; --surface2:#272B2F; --ink:#ECEDEA; --muted:#9BA19D; --line:#353A3E;
    --accent:#F4C430; --accent-ink:#141618; --danger:#E0705E; --ok:#5DBB8E; --warnbg:#3A2F1A;
    --g1:#5DBB8E; --g2:#6FA3DE; --g3:#A98BDB; --g4:#E3A04A; --g5:#E0705E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141618; --surface:#1D2023; --surface2:#272B2F; --ink:#ECEDEA; --muted:#9BA19D; --line:#353A3E;
  --accent:#F4C430; --accent-ink:#141618; --danger:#E0705E; --ok:#5DBB8E; --warnbg:#3A2F1A;
  --g1:#5DBB8E; --g2:#6FA3DE; --g3:#A98BDB; --g4:#E3A04A; --g5:#E0705E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
#app.worker{padding-block:0 calc(24px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand i{display:inline-block;width:.7em;height:.7em;border-radius:50%;border:.18em solid var(--accent);margin-right:.35em;vertical-align:-.05em}
.role{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.sync{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok{background:var(--ok)} .sync.busy{background:var(--accent)} .sync.err{background:var(--danger)}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:14px 10px}
.crumbs button{background:none;border:0;padding:6px 2px;font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:.02em;color:var(--muted)}
.crumbs button.on{color:var(--ink)}
.crumbs .sep{color:var(--line);font-weight:700}
.loadtotal{margin-left:auto;font-size:.9rem;color:var(--muted)}
.loadtotal b{font-family:var(--display);font-size:1.25rem;color:var(--ink)}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tiles.sizes{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;transition:transform .06s}
.tile:active{transform:scale(.98)}
.tile .big{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1}
.tile.size .big{font-size:1.55rem;letter-spacing:.01em}
.tile .meta{font-size:.85rem;color:var(--muted)}
.tile .meta b{color:var(--ink);font-weight:600}
.tile.has{border-color:color-mix(in srgb,var(--accent) 70%,var(--line))}
.bars{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.bars span{display:block;height:100%}

.gradehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px 14px}
.gradehead h2{margin:0;font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:.01em}
.sizetotal{text-align:right;color:var(--muted);font-size:.9rem}
.sizetotal b{display:block;font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--ink)}
.grades{display:grid;grid-template-columns:1fr;gap:10px}
.grade{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;min-height:84px;padding:10px 18px 10px 14px;background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--gc);border-radius:var(--radius);text-align:left;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.grade:active{transform:scale(.99)}
.grade .gl{display:flex;flex-direction:column;line-height:1}
.grade .gl small{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grade .gl span{font-family:var(--display);font-weight:700;font-size:2.4rem;color:var(--gc)}
.grade .gl span.txt{font-size:1.5rem}
.grade .gc{font-family:var(--display);font-weight:700;font-size:2.4rem;grid-column:3}
.dest{grid-column:2;display:flex;flex-direction:column;line-height:1.15;min-width:0}
.dest small{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dest b{font-family:var(--display);font-weight:700;font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest.none b{color:var(--danger);font-size:1.1rem}
.need{font-style:normal;font-size:.85rem;font-weight:700;color:var(--ok);white-space:nowrap}
.need.full{color:var(--danger);letter-spacing:.04em}
.last .lw .need{width:100%}
.fill{display:flex;flex-direction:column;gap:6px}
.fillbar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.fillbar span{display:block;height:100%;background:var(--ok);border-radius:5px}
.shortlist{display:flex;flex-wrap:wrap;gap:6px}
.short{font-size:.82rem;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.short b{color:var(--ink);font-weight:600}
table.amt{min-width:360px}
table.amt input.amtin{width:84px;min-height:38px;padding:6px 8px;text-align:right}
table.amt td.left,table.amt td.over{color:var(--danger);font-weight:700}
table.amt td.ok{text-align:center}
table.amt td.ok input{width:22px;height:22px;margin:0;accent-color:var(--ok)}
.need.met{color:var(--ok)}
table.amt tr.rimrow td{font-family:var(--body);font-size:1rem}
table.amt tr.rimrow td:first-child{font-family:var(--display);font-size:1.1rem}
table.amt td.done{color:var(--ok);font-weight:700}
.dest.hold b{display:inline-block;align-self:flex-start;background:var(--ink);color:var(--accent);padding:1px 8px;border-radius:4px;letter-spacing:.06em}
.holdtag{align-self:flex-start;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--ink);color:var(--accent);white-space:nowrap}
.tile.holdtile{border-style:dashed;border-color:var(--ink)}
.tile.dntile{border-color:var(--danger)}
.tile .tags{display:flex;flex-wrap:wrap;gap:4px}
.tile .tags:empty{display:none}
.holdtag.dntag{background:var(--danger);color:var(--surface)}
.grade.dn{border-color:var(--danger);border-left-color:var(--danger);background:repeating-linear-gradient(-45deg,var(--surface) 0 12px,color-mix(in srgb,var(--danger) 10%,var(--surface)) 12px 24px)}
.grade.dn .gl span,.grade.dn .gc{color:var(--muted)}
.dest.dn b{color:var(--danger);font-size:1.6rem;letter-spacing:.04em}
.dest.dn small{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:600}
@media (min-width:720px){.grade.dn{border-top-color:var(--danger)}}
.holdcell{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.08em;padding:6px 8px;border-radius:4px;background:var(--ink);color:var(--accent)}
.holdcard{border:2px dashed var(--ink)}
.dncard{border:2px solid var(--danger)}
.who{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.pickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.picker{min-height:72px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:700;font-size:1.5rem;text-align:left;padding:0 16px}
.gradingas{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:12px 0;font-size:.95rem;color:var(--muted)}
.gradingas b{color:var(--ink)}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow .in{flex:1 1 220px;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
.card.off{opacity:.7}
.offtag{background:var(--surface2);color:var(--muted)}
.rename{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mgrbtn{margin-left:4px}
.howto{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.howto summary{cursor:pointer;font-weight:700}
.howto ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;line-height:1.45}
.rename .in{flex:1 1 160px;min-width:0}
.adj{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--bg);border:1px dashed var(--line)}
table.adjt td{padding:6px 8px}
.adjcell{display:inline-flex;align-items:center;gap:8px}
.adjcell b{min-width:2ch;text-align:center;font-family:var(--display);font-size:1.15rem}
.adjbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.15rem;line-height:1}
.adjbtn[disabled]{opacity:.35;cursor:not-allowed}
.dncard h3{color:var(--danger)}
.holdrow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.holdrow .lr{flex:1;min-width:0;display:flex;flex-direction:column}
.holdrow .lr span{font-size:.85rem;color:var(--muted)}
.last.hold{border-left-color:var(--ink)}
.last.hold .tick{color:var(--ink)}
.grade.hit{animation:hit .35s ease-out}
@keyframes hit{0%{background:color-mix(in srgb,var(--gc) 35%,var(--surface))}100%{background:var(--surface)}}
.pop{position:absolute;right:18px;top:6px;font-family:var(--display);font-weight:700;color:var(--gc);animation:pop .5s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
@media (min-width:720px){
  .grades{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .grade{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;min-height:230px;border-left-width:1px;border-top:10px solid var(--gc);padding:16px;align-items:start}
  .dest{grid-column:1}
  .grade .gc{grid-column:1;font-size:3.4rem;align-self:end}
}
.last{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:var(--radius)}
.last.none{border-left-color:var(--danger)}
.last .tick{font-size:1.4rem;font-weight:700;color:var(--ok)}
.last.none .tick{color:var(--danger)}
.last .lw{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;line-height:1.2}
.last .lw small{width:100%;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.last .lw b{font-family:var(--display);font-size:1.3rem}
.last .lw span{font-weight:600;color:var(--muted)}
.last.fresh{animation:fresh .6s ease-out}
@keyframes fresh{0%{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}100%{background:var(--surface)}}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.typ{min-height:56px;border-radius:var(--radius);border:1px solid var(--line);border-left:8px solid var(--gc);background:var(--bg);font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.04em;text-align:left;padding:0 12px}
.typ{display:flex;align-items:center;gap:10px}
.typ .box{width:22px;height:22px;flex:none;border-radius:5px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--body);font-size:.9rem;color:var(--surface)}
.typ.on{background:color-mix(in srgb,var(--gc) 18%,var(--surface));border-color:var(--gc);box-shadow:inset 0 0 0 2px var(--gc)}
.typ.on .box{background:var(--gc);border-color:var(--gc)}
.newname{display:flex;flex-direction:column;gap:2px}
.newname b{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.1}
.chk{display:flex;align-items:flex-start;gap:10px;font-weight:600;line-height:1.35}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.chk .hint{font-weight:400}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding-block:14px}
.actions.tight{padding-block:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.sm{min-height:38px;padding:0 12px;font-size:.92rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.grow{flex:1 1 150px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:.02em}
.card.warn{background:var(--warnbg);border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.stack{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
.in{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem;letter-spacing:normal;text-transform:none;font-weight:500;color:var(--ink)}
textarea.in{min-height:90px;resize:vertical;line-height:1.5}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92rem;min-height:260px}
.hint{font-size:.88rem;color:var(--muted);margin:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink)}
.h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}

.trlhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.trlhead>div:first-child{min-width:0}
.trltotal{text-align:right;color:var(--muted);font-size:.85rem;line-height:1.1}
.trltotal b{display:block;font-family:var(--display);font-size:2.4rem;color:var(--ink)}
.gradeTotals{display:flex;flex-wrap:wrap;gap:8px}
.gt{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--gc);font-size:.9rem}
.gt b{font-family:var(--display);font-size:1.35rem}
.confirm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--danger)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
thead th .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gc);margin-right:5px}
tr.rimrow td{background:var(--surface2);font-family:var(--display);font-weight:700;font-size:1.1rem}
tr.sub td{font-weight:600;color:var(--muted)}
tr.grand td{font-family:var(--display);font-weight:700;font-size:1.2rem;border-top:2px solid var(--ink);border-bottom:0}
td.zero{color:var(--line)}
table.route td,table.route th{text-align:left;padding:6px 8px}
table.route select{min-width:120px;min-height:40px;padding:6px 8px}
table.route td.set select{border-color:color-mix(in srgb,var(--accent) 70%,var(--line))}
table.route td.sz{font-weight:600}

.loadlist{display:flex;flex-direction:column;gap:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in2{display:flex;width:100%;max-width:1000px}
.tabs button{flex:1;min-height:64px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:.85rem;color:var(--muted);border-top:3px solid transparent}
.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app" class="worker">
  <header class="top">
    <div class="brand"><i></i>Clicker Board</div>
    <span class="role" id="role" hidden>Manager</span>
    <span class="who" id="who" hidden></span>
    <button class="btn sm ghost mgrbtn" id="mgrBtn" data-act="mgrToggle" hidden>Manager</button>
    <div class="status"><span id="syncText">Connecting…</span><span class="sync" id="sync"></span></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="in2">
  <button data-act="view" data-v="count" id="tab-count"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>Count</button>
  <button data-act="view" data-v="trailers" id="tab-trailers"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="10" rx="1"/><path d="M15 9h3l3 3v4h-6"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Trailers</button>
  <button data-act="view" data-v="routing" id="tab-routing"><svg viewBox="0 0 24 24"><path d="M4 6h6l4 6h6M4 18h6l4-6"/><path d="M17 9l3 3-3 3"/></svg>Routing</button>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toLocaleDateString("en-CA");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>Number(n||0).toLocaleString("en-US");
const UNASSIGNED="unassigned";
const HOLD="holdout";

let deviceId=null;
try{deviceId=sessionStorage.getItem("tc-dev")}catch(e){}
if(!deviceId){deviceId="d"+rid();try{sessionStorage.setItem("tc-dev",deviceId)}catch(e){}}

// Used only when the page runs without the shared store (e.g. a preview).
const EXAMPLE_CONFIG={grades:["1","2","3","4","5"],rims:[
  {rim:"14",sizes:["14"]},{rim:"15",sizes:["100-15","200-15","235-75-15"]},
  {rim:"16",sizes:["Pass 16","Big 16","215-60-16","225-60-16","205-55-16"]},
  {rim:"17",sizes:["Low Pro 17","Pass 17","Big 17","215-55-17","245-65-17","265-70-17","225-65-17"]},
  {rim:"18",sizes:["Low Pro 18","Pass 18","Big 18"]},{rim:"19",sizes:["Low Pro 19","Pass 19"]},
  {rim:"20",sizes:["Low Pro 20","Pass 20"]},{rim:"22",sizes:["Low Pro 22","Pass 22"]}]};

/* ---------- stores ---------- */
function dbStore(db){
  let uns=[];
  const onErr=e=>{console.warn("db",e);if(e&&e.code==="revoked")toast("Saved counts are no longer available in this view.")};
  const docMap=q=>{const o={};q.docs.forEach(d=>{const x=d.data();o[d.id]={loadId:String(x.loadId||""),deviceId:String(x.deviceId||""),grader:String(x.grader||""),counts:x.counts&&typeof x.counts==="object"?x.counts:{}}});return o};
  const tid=(loadId,dev,grader)=>"tallies/"+loadId+"~"+dev+(grader?"~"+grader:"");
  return {kind:"db",
    watchConfig(cb){db.doc("config/main").onSnapshot(s=>cb(s.exists?s.data():null),onErr)},
    watchRoutes(cb){db.doc("config/routes").onSnapshot(s=>cb(s.exists&&s.data().routes||{}),onErr)},
    watchLoads(cb){db.collection("loads").orderBy("createdAt","desc").limit(300).onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),onErr)},
    watchTallies(ids,cb){
      uns.forEach(u=>u());uns=[];
      const chunks=[];for(let i=0;i<ids.length;i+=30)chunks.push(ids.slice(i,i+30));
      const parts=chunks.map(()=>({}));
      chunks.forEach((ch,ci)=>{uns.push(db.collection("tallies").where("loadId","in",ch).onSnapshot(q=>{parts[ci]=docMap(q);cb(Object.assign({},...parts))},onErr))});
    },
    async getTallies(loadId){return docMap(await db.collection("tallies").where("loadId","==",loadId).get())},
    async getMine(loadId,dev,grader){const s=await db.doc(tid(loadId,dev,grader)).get();return s.exists?(s.data().counts||{}):null},
    watchGraders(cb){db.doc("config/graders").onSnapshot(s=>cb(s.exists&&Array.isArray(s.data().list)?s.data().list:[]),onErr)},
    saveGraders(list){return db.doc("config/graders").set({list})},
    saveConfig(c){return db.doc("config/main").set(c)},
    saveRoutes(r){return db.doc("config/routes").set({routes:r})},
    saveLoad(l){const r=Object.assign({},l);delete r.id;return db.doc("loads/"+l.id).set(r)},
    watchRouting(cb){db.collection("routing").orderBy("createdAt","desc").limit(300).onSnapshot(q=>cb(q.docs.map(d=>Object.assign({id:d.id},d.data()))),onErr)},
    saveRouting(id,data){return db.doc("routing/"+id).set(data)},
    saveTally(loadId,dev,counts,grader){const d={loadId,deviceId:dev,counts,updatedAt:new Date().toISOString()};if(grader)d.grader=grader;return db.doc(tid(loadId,dev,grader)).set(d)}
  };
}
function localStore(){
  const K="tc-local-v3";let st=null;
  try{st=JSON.parse(lsGet(K)||"null")}catch(e){}
  if(!st)st={config:EXAMPLE_CONFIG,routes:{},loads:{},tallies:{},graders:[]};
  if(!st.graders)st.graders=[];
  const subs={config:[],routes:[],loads:[],graders:[]};let tcb=null,tids=[];
  const persist=()=>lsSet(K,JSON.stringify(st));
  const arr=()=>Object.keys(st.loads).map(id=>Object.assign({id},st.loads[id])).sort((a,b)=>a.createdAt<b.createdAt?1:-1);
  const docs=ids=>{const o={};for(const k in st.tallies){const p=k.split("~");if(p.length>=2&&ids.includes(p[0]))o[k]={loadId:p[0],deviceId:p[1],grader:p[2]||"",counts:Object.assign({},st.tallies[k])}}return o};
  const lk=(id,dev,grader)=>id+"~"+dev+(grader?"~"+grader:"");
  return {kind:"local",
    watchConfig(cb){subs.config.push(cb);setTimeout(()=>cb(st.config))},
    watchRoutes(cb){subs.routes.push(cb);setTimeout(()=>cb(st.routes))},
    watchLoads(cb){subs.loads.push(cb);setTimeout(()=>cb(arr()))},
    watchTallies(ids,cb){tcb=cb;tids=ids;setTimeout(()=>cb(docs(ids)))},
    async getTallies(id){return docs([id])},
    async getMine(id,dev,grader){const c=st.tallies[lk(id,dev,grader)];return c?Object.assign({},c):null},
    watchGraders(cb){subs.graders.push(cb);setTimeout(()=>cb(st.graders))},
    watchRouting(cb){subs.loads.push(cb);setTimeout(()=>cb(arr()))},
    async saveRouting(){},
    async saveGraders(list){st.graders=list;persist();subs.graders.forEach(f=>f(list))},
    async saveConfig(c){st.config=c;persist();subs.config.forEach(f=>f(c))},
    async saveRoutes(r){st.routes=r;persist();subs.routes.forEach(f=>f(r))},
    async saveLoad(l){const r=Object.assign({},l);delete r.id;st.loads[l.id]=r;persist();subs.loads.forEach(f=>f(arr()))},
    async saveTally(id,dev,counts,grader){st.tallies[lk(id,dev,grader)]=counts;persist();if(tcb)setTimeout(()=>tcb(docs(tids)))}
  };
}

/* ---------- Google Sheets store (Apps Script web app) ---------- */
const IS_GAS=!!window.GAS_INIT;
function gasStore(){
  const cbs={config:[],routes:[],graders:[],loads:[],routing:[]};let tcb=null,tids=[];let last=null,rev=-1,timer=null,inflight=false;const seen={};
  const pin=()=>{try{return localStorage.getItem("tc-pin")||""}catch(e){return ""}};
  const run=(payload)=>new Promise((res,rej)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.error)rej({code:r.code||"unavailable",message:r.error});else res(r)}).withFailureHandler(e=>rej({code:"unavailable",message:String(e&&e.message||e)})).api(JSON.stringify(payload))});
  const call=(action,payload)=>run(Object.assign({action,pin:pin(),dev:deviceId},payload||{}));
  const filt=()=>{const o={};if(!last)return o;for(const id in last.tallies){const t=last.tallies[id];if(tids.includes(t.loadId))o[id]={loadId:t.loadId,deviceId:t.deviceId,grader:t.grader||"",counts:t.counts||{}}}return o};
  const part=(st,k)=>k==="routes"?(st.routes||{}):k==="loads"||k==="routing"?(st.loads||[]):k==="graders"?(st.graders||[]):st.config;
  function apply(st){
    if(!st||st.same)return;rev=st.rev;last=st;
    if(st.appUrl)S.appUrl=st.appUrl;if(st.sheetUrl)S.sheetUrl=st.sheetUrl;
    for(const k in cbs){const v=part(st,k);const str=JSON.stringify(v);if(seen[k]===str)continue;seen[k]=str;cbs[k].forEach(f=>f(v))}
    const ts=JSON.stringify(st.tallies)+"|"+tids.join(",");if(tcb&&seen.t!==ts){seen.t=ts;tcb(filt())}
  }
  async function poll(){
    clearTimeout(timer);if(inflight){timer=setTimeout(poll,600);return}inflight=true;
    try{apply(await call("state",{rev}));if(!dirty.size&&$("#sync").classList.contains("err"))setSync("ok","Saved")}
    catch(e){console.warn(e);setSync("err","Offline · retrying")}
    inflight=false;timer=setTimeout(poll,document.visibilityState==="visible"?4000:20000);
  }
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
  const reg=(k,cb)=>{cbs[k].push(cb);if(last)setTimeout(()=>cb(part(last,k)))};
  const after=p=>p.then(r=>{setTimeout(poll,250);return r});
  setTimeout(poll,0);
  return {kind:"gas",
    whoami:()=>call("whoami").then(r=>!!r.isManager).catch(()=>false),
    checkPin:p=>run({action:"checkPin",pin:p}),
    setPin:p=>call("setPin",{newPin:p}),
    refresh(){rev=-1;for(const k in seen)delete seen[k];poll()},
    watchConfig:cb=>reg("config",cb),watchRoutes:cb=>reg("routes",cb),watchGraders:cb=>reg("graders",cb),
    watchLoads:cb=>reg("loads",cb),watchRouting:cb=>reg("routing",cb),
    watchTallies(ids,cb){tcb=cb;tids=ids;delete seen.t;if(last)setTimeout(()=>{seen.t=JSON.stringify(last.tallies)+"|"+tids.join(",");cb(filt())})},
    async getTallies(lid){const r=await call("getTallies",{lid});return r.tallies||{}},
    async getMine(lid,dev,grader){const r=await call("getMine",{lid,dev,grader});return r.counts||null},
    saveConfig:c=>after(call("saveConfig",{config:c})),
    saveRoutes:r=>after(call("saveRoutes",{routes:r})),
    saveGraders:l=>after(call("saveGraders",{list:l})),
    saveLoad:l=>after(call("saveLoad",{load:l})),
    async saveRouting(){},
    saveTally:(lid,dev,counts,grader)=>after(call("saveTally",{lid,dev,counts,grader}))
  };
}
// Files are handed to the browser directly on the Google version.
const gasDownloads={save({filename,data}){return new Promise((res,rej)=>{try{
  const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000);res({status:"saved"});
}catch(e){rej({code:"unavailable"})}})}};

/* ---------- state ---------- */
const S={store:null,dl:null,isManager:false,graders:[],gradersReady:false,grader:"",linkGrader:"",gdraft:"",gedit:null,config:null,configReady:false,routes:{},loads:[],loadsReady:false,
  tallies:{},mine:{},mineInit:{},initing:{},rim:null,size:null,view:"count",undo:[],
  expanded:{},adjOpen:{},adjDraft:{},confirmClear:null,confirmShip:null,shippedOpen:null,shippedData:{},hdraft:{rim:"",size:"",grades:[],editing:null},amts:{},draft:{grades:[],routeAll:true,trailer:"",loadNo:"",destination:""},warned:{}};

function normConfig(c){
  const grades=(c&&Array.isArray(c.grades)&&c.grades.length?c.grades:["1","2","3","4","5"]).map(String);
  const holdouts=(Array.isArray(c&&c.holdouts)?c.holdouts:[]).filter(h=>h&&h.rim&&h.size).map(h=>({rim:String(h.rim),size:String(h.size),grades:(h.grades||[]).map(String)}));
  if(!c||!Array.isArray(c.rims))return {rims:[],grades,holdouts};
  return {rims:c.rims.filter(r=>r&&r.rim).map(r=>({rim:String(r.rim),sizes:(r.sizes||[]).map(String)})),grades,holdouts};
}
// Sizes on a rim's size screen: its regular sizes plus any hold-out sizes for that rim.
function rimSizes(r){const out=r.sizes.slice();S.config.holdouts.forEach(h=>{if(h.rim===r.rim&&!out.includes(h.size))out.push(h.size)});return out}
const holdFor=(rim,size)=>S.config.holdouts.find(h=>h.rim===rim&&h.size===size)||null;
const isHeld=(rim,size,g)=>{const h=holdFor(rim,size);return !!h&&h.grades.includes(g)};
const destLabel=id=>id===UNASSIGNED?"Unassigned":id===HOLD?"HOLD OUT":id===DN?"DON'T NEED pile":loadName(loadById(id));
const gColor=i=>"var(--g"+((i%5)+1)+")";
const key=(r,s,g)=>r+"|"+s+"|"+g;
const gradeName=g=>/^\d+$/.test(g)?"Grade "+g:g;
const isOpen=l=>l&&l.status!=="shipped";
const openLoads=()=>S.loads.filter(isOpen);
const loadById=id=>S.loads.find(l=>l.id===id)||null;
// The set list of trailers a manager can pick from: one per grade (GRADE 1 … GRADE 5).
// A trailer can carry one grade or several (GRADE 2 & 3).
const typeFor=g=>/^\d+$/.test(g)?"GRADE "+g:String(g).toUpperCase();
const trailerTypes=()=>S.config.grades.map(g=>({grade:g,type:typeFor(g)}));
const joinAnd=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" & "+a[a.length-1];
const orderGrades=gs=>{const o=S.config.grades;return gs.slice().sort((a,b)=>(o.indexOf(a)<0?999:o.indexOf(a))-(o.indexOf(b)<0?999:o.indexOf(b)))};
function typeForGrades(gs){gs=orderGrades(gs);return gs.every(g=>/^\d+$/.test(g))?"GRADE "+joinAnd(gs):joinAnd(gs.map(g=>String(g).toUpperCase()))}
function gradesPhrase(gs){gs=orderGrades(gs);return gs.every(g=>/^\d+$/.test(g))?"Grade "+joinAnd(gs):joinAnd(gs)}
const loadGrades=l=>Array.isArray(l.grades)?l.grades.map(String):(l.grade!=null?[String(l.grade)]:[]);
const loadName=l=>{if(!l)return "No trailer set";if(l.type)return l.type+(l.trailer?" · #"+l.trailer:"");return l.trailer?"Trailer "+l.trailer:(l.loadNo?"Load "+l.loadNo:"Unnamed trailer")};
const loadSub=l=>[l.loadNo&&(l.type||l.trailer)?"Load "+l.loadNo:"",l.destination,l.date].filter(Boolean).join(" · ");
// Where a tap on this size + grade goes right now.
// Newest open trailer that carries this grade (e.g. GRADE 2 & 3 for grade 3).
const gradeTrailer=g=>openLoads().find(l=>loadGrades(l).includes(g))||null;
// Amounts needed: a trailer's targets are per size ("rim|size"), and every grade on the trailer counts toward them.
const sizeKey=(r,s)=>r+"|"+s;
const loadTargets=l=>(l&&l.targets&&typeof l.targets==="object")?l.targets:{};
function sizeCounts(counts){const o={};for(const k in counts||{}){const [r,s]=k.split("|");const n=counts[k];if(n)o[r+"|"+s]=(o[r+"|"+s]||0)+n}return o}
// A rim-level amount ("17|*") counts any size on that rim.
const ANY="*";
const rimKey=r=>r+"|"+ANY;
function rimCount(sc,r){let n=0;for(const k in sc)if(k.slice(0,k.indexOf("|"))===r)n+=sc[k];return n}
function fillFor(l,counts){
  const t=loadTargets(l);const sc=sizeCounts(counts);let need=0,have=0,short=0;const rows=[];
  const rims=S.config.rims.map(r=>r.rim);for(const k in t){const r=k.slice(0,k.indexOf("|"));if(!rims.includes(r))rims.push(r)}
  rims.forEach(r=>{
    const cfg=S.config.rims.find(x=>x.rim===r);const sizes=cfg?rimSizes(cfg):[];
    for(const k in t){const i=k.indexOf("|");if(k.slice(0,i)===r){const s=k.slice(i+1);if(s!==ANY&&!sizes.includes(s))sizes.push(s)}}
    const rn=+t[rimKey(r)]||0;const rh=rimCount(sc,r);let sNeed=0,sHave=0;
    if(rn>0){if(rh<rn)short++;rows.push({rim:r,size:"Any size",any:true,ok:overOk(l,rimKey(r)),target:rn,have:rh,left:rn-rh})}
    sizes.forEach(s=>{const n=+t[sizeKey(r,s)]||0;if(n<=0)return;const h=sc[sizeKey(r,s)]||0;sNeed+=n;sHave+=Math.min(h,n);if(h<n)short++;rows.push({rim:r,size:s,ok:overOk(l,sizeKey(r,s)),target:n,have:h,left:n-h})});
    // A rim amount covers its specific sizes too, so take whichever asks for more.
    if(rn>0&&rn>=sNeed){need+=rn;have+=Math.min(rh,rn)}else{need+=sNeed;have+=sHave}
  });
  return {need,have,short,rows};
}
// What the worker sees under "Goes to": the tighter of the size amount and the rim amount.
// Amounts marked "Over OK" are minimums: once met, more is fine.
const overOk=(l,k)=>!!(l&&l.overOk&&l.overOk[k]);
function needText(l,counts,r,s){
  const t=loadTargets(l);const sc=sizeCounts(counts);const opts=[];
  const sk=sizeKey(r,s),rk=rimKey(r);
  const n=+t[sk]||0;if(n)opts.push({left:n-(sc[sk]||0),label:"",ok:overOk(l,sk)});
  const rn=+t[rk]||0;if(rn)opts.push({left:rn-rimCount(sc,r),label:" "+r+"″",ok:overOk(l,rk)});
  if(!opts.length)return null;
  const capped=opts.filter(o=>!o.ok&&o.left<=0);
  if(capped.length){const o=capped.reduce((a,b)=>b.left<a.left?b:a);return {cls:"full",label:o.label,over:-o.left,text:"FULL"+(o.label?" ·"+o.label:"")+(o.left<0?" · "+(-o.left)+" over":"")}}
  const open=opts.filter(o=>o.left>0);
  if(open.length){const o=open.reduce((a,b)=>b.left<a.left?b:a);return {cls:"",text:o.left+" more"+o.label+" needed"}}
  return {cls:"met",text:"Goal met · more OK"};
}
// Why a tire isn't wanted right now: its trailer's amount for this size or rim is full (and not Over OK).
function notNeeded(lid,nt){
  if(nt&&nt.cls==="full")return loadName(loadById(lid))+" is full"+(nt.label?" on"+nt.label:"")+(nt.over>0?" · "+nt.over+" over":"");
  return null;
}
const leftText=(n,left,ok)=>!n?"–":left>0?fmt(left):left===0?(ok?"Met":"Full"):(ok?"Met · +"+fmt(-left):"+"+fmt(-left)+" over");
// Hold-out first, then the size's own routing, then the open trailer for its grade.
function destFor(k){const [r,s,g]=k.split("|");if(isHeld(r,s,g))return HOLD;const id=S.routes[k];const l=id?loadById(id):null;if(isOpen(l))return l.id;const gt=gradeTrailer(g);return gt?gt.id:UNASSIGNED}

// Counts per load: other devices' saved docs plus this device's live counts.
// Manager adjustments are saved apart from workers' taps: S.mine["adj:<load>"], stored under device "m<this device>".
const ADJ="adj:";
const adjDev="m"+deviceId;
const GK="~g~";
const mkey=(lid,g)=>lid+GK+(g||"");
const saveTarget=key=>{if(key.startsWith(ADJ))return {lid:key.slice(ADJ.length),dev:adjDev,grader:""};const i=key.indexOf(GK);return i<0?{lid:key,dev:deviceId,grader:""}:{lid:key.slice(0,i),dev:deviceId,grader:key.slice(i+GK.length)}};
const ownKey=d=>d.deviceId===deviceId?mkey(d.loadId,d.grader):d.deviceId===adjDev?ADJ+d.loadId:null;
function countsByLoad(){
  const out={};
  for(const id in S.tallies){const d=S.tallies[id];if(d.deviceId===deviceId||d.deviceId===adjDev)continue;const o=out[d.loadId]||(out[d.loadId]={});for(const k in d.counts){const n=+d.counts[k]||0;if(n)o[k]=(o[k]||0)+n}}
  for(const key in S.mine){const lid=saveTarget(key).lid;const o=out[lid]||(out[lid]={});const m=S.mine[key];for(const k in m){if(m[k])o[k]=(o[k]||0)+m[k]}}
  for(const lid in out)for(const k in out[lid])if(!out[lid][k])delete out[lid][k];
  return out;
}
// Net tires added (+) or taken off (−) by managers on a load.
function adjTotal(lid){
  let n=0;
  for(const id in S.tallies){const d=S.tallies[id];if(d.loadId!==lid||d.deviceId===adjDev||d.deviceId[0]!=="m")continue;for(const k in d.counts)n+=+d.counts[k]||0}
  const m=S.mine[ADJ+lid]||{};for(const k in m)n+=m[k];
  return n;
}
function allCounts(by){const t={};for(const lid in by)for(const k in by[lid])t[k]=(t[k]||0)+by[lid][k];return t}
const sumWhere=(t,fn)=>{let n=0;for(const k in t)if(fn(k.split("|")))n+=t[k];return n};
function gradeList(t){const g=S.config.grades.slice();for(const k in t){const gg=k.split("|")[2];if(gg!=null&&!g.includes(gg))g.push(gg)}return g}
function breakdown(t){
  t=t||{};const grades=gradeList(t);const rims=new Map();
  S.config.rims.forEach(r=>rims.set(r.rim,new Map(rimSizes(r).map(s=>[s,null]))));
  for(const k in t){const [r,s]=k.split("|");if(!rims.has(r))rims.set(r,new Map());if(!rims.get(r).has(s))rims.get(r).set(s,null)}
  const out=[];
  rims.forEach((sizes,rim)=>{
    const rs=[];const rg=grades.map(()=>0);let rt=0;
    sizes.forEach((_,size)=>{const g=grades.map(gr=>t[key(rim,size,gr)]||0);const tot=g.reduce((a,b)=>a+b,0);if(tot){rs.push({size,g,total:tot});g.forEach((n,i)=>rg[i]+=n);rt+=tot}});
    if(rt)out.push({rim,sizes:rs,g:rg,total:rt});
  });
  const gt=grades.map((_,i)=>out.reduce((a,r)=>a+r.g[i],0));

let saveTimer=null,saving=false,again=false;const dirty=new Set();
function setSync(cls,text){$("#sync").className="sync "+(cls||"");$("#syncText").textContent=text||""}
function queueSave(lid){dirty.add(lid);setSync("busy","Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,400)}
async function flushSave(){
  clearTimeout(saveTimer);
  if(saving){again=true;return}
  saving=true;
  while(dirty.size){
    const lid=dirty.values().next().value;dirty.delete(lid);
    try{
      if(!S.mineInit[lid]){
        // First write for this load from this screen: add any counts this screen saved earlier.
        S.initing[lid]=true;
        const tg=saveTarget(lid);const prev=await S.store.getMine(tg.lid,tg.dev,tg.grader);
        if(!S.mineInit[lid]){const m=Object.assign({},prev||{});const cur=S.mine[lid]||{};for(const k in cur)m[k]=(m[k]||0)+cur[k];S.mine[lid]=m;S.mineInit[lid]=true}
        S.initing[lid]=false;
      }
      {const tg=saveTarget(lid);await S.store.saveTally(tg.lid,tg.dev,Object.assign({},S.mine[lid]||{}),tg.grader)}
    }catch(e){
      S.initing[lid]=false;
      if(e&&e.code==="unavailable"&&!e._retried){e._retried=true;dirty.add(lid);await sleep(600+Math.random()*900);continue}
      dirty.add(lid);setSync("err","Not saved");
      if(e&&e.code==="invalid_argument")toast(IS_GAS?"This count wasn't accepted. Ask a manager.":"This account can't save counts. Ask a manager for Contributor access.");
      else if(e&&e.code==="quota_exceeded")toast("Storage is full. A manager needs to clear old loads.");
      else toast("Couldn't save the last taps. They'll retry on your next tap.");
      saving=false;return;
    }
  }
  saving=false;setSync("ok","Saved");
  if(again){again=false;if(dirty.size)flushSave()}
}

/* ---------- setup parsing ---------- */
function configToText(c){return c.rims.map(r=>r.rim+": "+r.sizes.join(", ")).join("\n")}
function parseSizes(text){
  const rims=[];const seen=new Map();
  text.split(/\n+/).forEach(line=>{
    line=line.trim();if(!line)return;
    const m=line.match(/^([^:=]+)[:=](.*)$/);if(!m)return;
    const rim=m[1].replace(/["″”'|]|rims?|inch(es)?/gi,"").trim();if(!rim)return;
    const sizes=m[2].split(/[,;]+/).map(s=>s.replace(/\|/g,"").replace(/\s+/g," ").trim()).filter(Boolean);
    let r=seen.get(rim);if(!r){r={rim,sizes:[]};seen.set(rim,r);rims.push(r)}
    sizes.forEach(s=>{if(!r.sizes.includes(s))r.sizes.push(s)});
  });
  return rims;
}
function parseGrades(text){const out=[];text.split(/[,\n]+/).map(s=>s.replace(/\|/g,"").trim()).filter(Boolean).forEach(g=>{if(!out.includes(g))out.push(g)});return out}

function graderRows(){
  const gc=graderCounts();const grades=S.config.grades;
  const rows=[["Grader","Trailer / pile"].concat(grades.map(gradeName),["Total"])];
  const ids=S.graders.map(g=>g.id);if(gc[""])ids.push("");
  ids.forEach(gid=>{const per=gc[gid]||{};let gt=grades.map(()=>0);
    Object.keys(per).forEach(lid=>{const c=per[lid];const row=grades.map(g=>sumWhere(c,k=>k[2]===g));const tot=Object.values(c).reduce((a,x)=>a+x,0);if(!tot)return;
      rows.push([graderName(gid),destLabel(lid)].concat(row,[tot]));gt=gt.map((x,i)=>x+row[i])});
    const tot=gt.reduce((a,x)=>a+x,0);if(tot)rows.push([graderName(gid),"ALL"].concat(gt,[tot]));
  });
  return rows;
}
async function exportGraders(btn){
  const rows=graderRows();if(rows.length<2){toast("No grader counts yet.");return}
  const label=btn.textContent;btn.disabled=true;btn.textContent="Preparing…";
  try{await loadScript(XLSX_SRC);const X=window.XLSX;const wb=X.utils.book_new();const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:16},{wch:20}].concat(S.config.grades.map(()=>({wch:10})),[{wch:9}]);X.utils.book_append_sheet(wb,ws,"By grader");
    await save(safeName("Graders - "+today())+".xlsx",new Uint8Array(X.write(wb,{bookType:"xlsx",type:"array"})))}
  catch(e){console.warn(e);toast("Couldn't build the spreadsheet. Check your connection and try again.")}
  finally{btn.disabled=false;btn.textContent=label}
}

  let h='<h3>Hold-out sizes</h3><p class="hint">A hold-out size shows on the size screen for its rim. For the grades you pick, those tires go to <b>HOLD OUT</b> instead of a grade trailer. Other grades of that size route normally.</p>';
  h+=c.holdouts.length?'<div class="loadlist">'+c.holdouts.map((x,i)=>'<div class="holdrow"><span class="lr"><b>'+esc(x.size)+'</b><span>'+esc(x.rim)+'″ rim · held out of '+esc(x.grades.length?gradesPhrase(x.grades):"no grades")+'</span></span><button class="btn sm" data-act="holdEdit" data-i="'+i+'">Edit</button><button class="btn sm danger" data-act="holdDel" data-i="'+i+'">Remove</button></div>').join("")+'</div>':'<p class="hint">No hold-out sizes yet.</p>';
  h+='<form id="holdForm" class="stack" style="padding-block:4px 0"><div class="eyebrow">'+(d.editing!=null?"Edit hold-out size":"Add a hold-out size")+'</div><div class="fields"><label class="f">Rim<select class="in" id="hd-rim" data-hdraft="rim">'+c.rims.map(r=>'<option value="'+esc(r.rim)+'"'+(r.rim===d.rim?" selected":"")+'>'+esc(r.rim)+'″</option>').join("")+'</select></label>'
    +'<label class="f">Size<input class="in" id="hd-size" data-hdraft="size" autocomplete="off" placeholder="e.g. 235-60-18" value="'+esc(d.size)+'"></label></div>'
    +'<div class="eyebrow">Hold out of these grades</div>'+typeChips(d.grades,"holdGrade","")
    +'<div class="actions tight"><button class="btn primary grow" type="submit">'+(d.editing!=null?"Save hold-out":"Add hold-out")+'</button>'+(d.editing!=null?'<button class="btn grow ghost" type="button" data-act="holdCancel">Cancel</button>':"")+'</div></form>';
  return h;
}
function refreshHoldCard(){const el=$("#holdCard");if(el)el.innerHTML=holdCardHtml()}
async function saveHoldouts(list,msg){
  const cfg={rims:S.config.rims,grades:S.config.grades,holdouts:list};
  try{await S.store.saveConfig(cfg);S.config=normConfig(cfg);S.hdraft={rim:S.hdraft.rim,size:"",grades:[],editing:null};refreshHoldCard();toast(msg)}
  catch(e){toast(e&&e.code==="invalid_argument"?"Only managers can change hold-outs.":"Couldn't save hold-outs. Try again.")}
}
function updateSetupCount(){const ta=$("#setSizes"),out=$("#setCount");if(!ta||!out)return;const r=parseSizes(ta.value);out.textContent=r.length+" rim sizes · "+r.reduce((a,x)=>a+x.sizes.length,0)+" sizes"}

let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3000)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const id=el.dataset.id;
  switch(el.dataset.act){
    case "view":S.view=el.dataset.v;$("#main").innerHTML="";render();window.scrollTo(0,0);break;
    case "rim":{S.rim=el.dataset.r;const rr=S.config.rims.find(r=>r.rim===S.rim);const rs=rr?rimSizes(rr):[];S.size=rs.length===1?rs[0]:null;render();window.scrollTo(0,0);break}
    case "size":S.size=el.dataset.s;render();window.scrollTo(0,0);break;
    case "go":{const lv=+el.dataset.l;if(lv===0){S.rim=null;S.size=null}else if(lv===1)S.size=null;render();break}
    case "tap":tap(el.dataset.g);break;
    case "undo":undo();break;
    case "toggle":S.expanded[id]=!S.expanded[id];render();break;
    case "amts":S.amts[id]=!S.amts[id];render();break;
    case "pickType":S.draft.grades=toggleIn(draftGrades(),el.dataset.g);render();break;
    case "editGrade":editGrades(id,el.dataset.g);break;
    case "routeHere":routeHere(id);break;
    case "moveUn":moveUnassigned(el);break;
    case "pickGrader":pickGrader(id);break;
    case "mgrToggle":
      if(S.isManager){try{localStorage.removeItem("tc-pin")}catch(e){}S.isManager=false;S.view="count";S.store.refresh();$("#main").innerHTML="";render();toast("Locked. Manager tabs are hidden.")}
      else{S.pinOpen=true;S.view="count";$("#main").innerHTML="";render();setTimeout(()=>{const i=document.getElementById("pin-in");if(i)i.focus()},0)}
      break;
    case "pinCancel":S.pinOpen=false;render();break;
    case "switchGrader":S.grader="";try{localStorage.removeItem("tc-grader")}catch(e){}render();break;
    case "copyLink":copyLink(id,el);break;
    case "renameGrader":S.gedit=id;render();setTimeout(()=>{const i=document.getElementById("rg-name");if(i)i.focus()},0);break;
    case "cancelRename":S.gedit=null;render();break;
    case "toggleGrader":{const g=graderById(id);if(g)saveGraderList(S.graders.map(x=>x.id===id?Object.assign({},x,{active:x.active===false}):x),g.active===false?g.name+"'s link is back on.":g.name+"'s link is off. Their counts stay.");break}
    case "xlsxGraders":exportGraders(el);break;
    case "adjOpen":S.adjOpen[id]=!S.adjOpen[id];S.confirmClear=null;render();break;
    case "adjDec":{const k=el.dataset.k;if(adjust(id,k,-1)){render();const [,sz,g]=k.split("|");toast("Took 1 · "+sz+" · "+gradeName(g)+" off "+destLabel(id)+".")}break}
    case "adjInc":{const k=el.dataset.k;adjust(id,k,1);render();break}
    case "adjAdd":addFromDraft(id);break;
    case "askClear":S.confirmClear=id;render();break;
    case "cancelClear":S.confirmClear=null;render();break;
    case "clearAll":removeAll(id);break;
    case "holdGrade":{const g=el.dataset.g;const a=S.hdraft.grades;S.hdraft.grades=a.includes(g)?a.filter(x=>x!==g):a.concat([g]);refreshHoldCard();break}
    case "holdEdit":{const x=S.config.holdouts[+el.dataset.i];if(x){S.hdraft={rim:x.rim,size:x.size,grades:x.grades.slice(),editing:+el.dataset.i};refreshHoldCard()}break}
    case "holdCancel":S.hdraft={rim:S.hdraft.rim,size:"",grades:[],editing:null};refreshHoldCard();break;
    case "holdDel":{const i=+el.dataset.i;const x=S.config.holdouts[i];if(x)saveHoldouts(S.config.holdouts.filter((_,j)=>j!==i),x.size+" is no longer held out.");break}
    case "askShip":S.confirmShip=id;render();break;
    case "cancelShip":S.confirmShip=null;render();break;
    case "ship":shipLoad(id);break;
    case "shipped":openShipped(id);break;
    case "reopen":reopenLoad(id);break;
    case "xlsx":exportLoadExcel(id,el);break;
    case "xlsxAll":exportAllExcel(el);break;
    case "pdf":exportPdf(id,el);break;
    case "resetSetup":$("#main").innerHTML=renderSetup();updateSetupCount();break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.draftchk){S.draft[t.dataset.draftchk]=t.checked;return}
  if(t.dataset&&t.dataset.hdraft){S.hdraft[t.dataset.hdraft]=t.value;return}
  if(t.dataset&&t.dataset.adjdraft){const d=S.adjDraft[t.dataset.id]||(S.adjDraft[t.dataset.id]={});d[t.dataset.adjdraft]=t.value;return}
  if(t.dataset&&t.dataset.overokLoad){const l=loadById(t.dataset.overokLoad);if(l){const o=Object.assign({},l.overOk||{});if(t.checked)o[t.dataset.overokKey]=true;else delete o[t.dataset.overokKey];l.overOk=o;saveLoadSoon(l,true);render()}return}
  const ks=t.dataset&&t.dataset.routeKeys;if(ks==null)return;
  const v=e.target.value;if(v==="__mixed")return;
  ks.split("\n").forEach(k=>{if(v)S.routes[k]=v;else delete S.routes[k]});
  saveRoutes();render();
  toast(v?"Routed to "+loadName(loadById(v))+".":"Set to go to the trailer for its grade.");
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="pinForm"){
    const p=(document.getElementById("pin-in")||{}).value||"";if(!p){toast("Enter the PIN.");return}
    try{const r=await S.store.checkPin(p);
      if(r&&r.ok){try{localStorage.setItem("tc-pin",p)}catch(e){}S.isManager=true;S.pinOpen=false;S.store.refresh();$("#main").innerHTML="";render();toast("Manager tabs unlocked.")}
      else toast("That PIN isn't right.")}
    catch(err){toast(err&&err.code==="rate_limited"?err.message:"Couldn't check the PIN. Try again.")}
    return}
  if(e.target.id==="pinChange"){
    const p=((document.getElementById("np-pin")||{}).value||"").trim();if(!/^[A-Za-z0-9]{4,20}$/.test(p)){toast("Use 4–20 letters or numbers.");return}
    try{await S.store.setPin(p);try{localStorage.setItem("tc-pin",p)}catch(e){}document.getElementById("np-pin").value="";toast("PIN changed. Other manager devices need the new PIN.")}
    catch(err){toast("Couldn't change the PIN. Try again.")}
    return}
  if(e.target.id==="addGrader"){addGrader();return}
  if(e.target.id==="renameGrader"){const i=document.getElementById("rg-name");const name=(i&&i.value||"").replace(/\s+/g," ").trim();const id=i&&i.dataset.rename;if(!name){toast("Enter a name.");return}S.gedit=null;if(document.activeElement)document.activeElement.blur();saveGraderList(S.graders.map(x=>x.id===id?Object.assign({},x,{name}):x),"Renamed to "+name+". Their link stays the same.");return}
  if(e.target.id==="addTrailer"){document.activeElement&&document.activeElement.blur&&document.activeElement.blur();addTrailer()}
  if(e.target.id==="holdForm"){
    const d=S.hdraft;const size=d.size.replace(/\|/g,"").replace(/\s+/g," ").trim();
    if(!d.rim){toast("Add rim sizes first.");return}
    if(!size){toast("Enter the hold-out size.");return}
    if(!d.grades.length){toast("Pick at least one grade to hold it out of.");return}
    const entry={rim:d.rim,size,grades:orderGrades(d.grades)};
    let list=S.config.holdouts.slice();
    if(d.editing!=null)list[d.editing]=entry;else list=list.filter(x=>!(x.rim===entry.rim&&x.size===entry.size)).concat([entry]);
    saveHoldouts(list,size+" is held out of "+gradesPhrase(entry.grades)+".");
    return;
  }
  if(e.target.id==="setupForm"){
    const rims=parseSizes($("#setSizes").value);const grades=parseGrades($("#setGrades").value);
    if(!rims.length){toast("Add at least one line like “17: Pass 17, Big 17”.");return}
    if(!grades.length){toast("Add at least one grade.");return}
    const holdouts=S.config.holdouts;
    try{await S.store.saveConfig({rims,grades,holdouts});S.config=normConfig({rims,grades,holdouts});$("#main").innerHTML=renderSetup();updateSetupCount();toast("Setup saved.")}
    catch(err){toast(err&&err.code==="invalid_argument"?"Only managers can change setup.":"Couldn't save setup. Try again.")}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.draft){S.draft[t.dataset.draft]=t.value;return}
  if(t.dataset.gdraft){S.gdraft=t.value;return}
  if(t.dataset.hdraft){S.hdraft[t.dataset.hdraft]=t.value;return}
  if(t.dataset.adjdraft){const d=S.adjDraft[t.dataset.id]||(S.adjDraft[t.dataset.id]={});d[t.dataset.adjdraft]=t.value;return}
  if(t.dataset.targetLoad){const l=loadById(t.dataset.targetLoad);if(l){const n=parseInt(t.value,10);const tg=Object.assign({},loadTargets(l));if(n>0)tg[t.dataset.targetKey]=n;else delete tg[t.dataset.targetKey];l.targets=tg;saveLoadSoon(l)}return}
  if(t.dataset.field&&t.dataset.load){const l=loadById(t.dataset.load);if(l){l[t.dataset.field]=t.value;saveLoadSoon(l)}return}
  if(t.id==="setSizes")updateSetupCount();
});
document.addEventListener("focusout",e=>{const t=e.target;if(t.dataset&&t.dataset.targetLoad){const l=loadById(t.dataset.targetLoad);if(l&&loadTimers[l.id])saveLoadSoon(l,true);return}if(t.dataset&&t.dataset.field&&t.dataset.load){const l=loadById(t.dataset.load);if(l&&loadTimers[l.id]){saveLoadSoon(l,true)}}});

/* ---------- boot ---------- */
async function boot(){
  applyHash();
  render();
  let db=null,dl=null,user=null;
  if(IS_GAS){
    S.dl=gasDownloads;S.store=gasStore();
    S.isManager=await S.store.whoami();
    setSync("ok","Ready");
  }else if(window.claude&&typeof window.claude.use==="function"){
    try{[db,dl,user]=await Promise.all([window.claude.use("db"),window.claude.use("downloads"),window.claude.use("user")])}catch(e){}
  }
  if(!IS_GAS){
  S.dl=dl;
  S.store=db?dbStore(db):localStore();
  if(!db)S.isManager=true;
  // Manager tabs are for the board's owner only. Graders invited as Editors still get just the counting screen.
  else if(user){try{S.isManager=await user.isOwner()}catch(e){S.isManager=false}}
  setSync("ok",db?"Ready":"This device only");
  }
  S.store.watchConfig(c=>{S.config=normConfig(c);S.configReady=true;
    const fe=document.activeElement;
    if(S.view==="setup"){
      const inForm=fe&&fe.closest&&fe.closest("#setupForm"),inHold=fe&&fe.closest&&fe.closest("#holdCard");
      if(!inForm&&!inHold){$("#main").innerHTML=renderSetup();updateSetupCount()}
      else if(inForm)refreshHoldCard();
    }
    render()});
  S.store.watchRoutes(r=>{S.routes=Object.assign({},r);render()});
  S.store.watchGraders(list=>{S.graders=(list||[]).filter(g=>g&&g.id&&g.name).map(g=>({id:String(g.id),name:String(g.name),active:g.active!==false,createdAt:g.createdAt||""}));S.gradersReady=true;render()});
  if(S.isManager||IS_GAS){
    S.store.watchLoads(l=>{
      const ids=new Set(l.map(x=>x.id));
      // keep a trailer just added here until the store echoes it
      S.loads=l.concat(S.loads.filter(x=>!ids.has(x.id)&&Date.now()-Date.parse(x.createdAt||0)<15000));
      S.loadsReady=true;loadsSeen=true;resubTallies();render();syncRouting()});
    S.store.watchRouting(r=>{r.forEach(x=>{const o=Object.assign({},x);delete o.id;routingSeen[x.id]=o});routingReady=true;syncRouting()});
  }else{
    // Graders: routing copy only (which grades each trailer takes and its amounts), no trailer details.
    S.store.watchRouting(r=>{S.loads=r.map(x=>({id:x.id,status:x.status,grades:x.grades||[],targets:x.targets||{},overOk:x.overOk||{},createdAt:x.createdAt||""}));S.loadsReady=true;resubTallies();render()});
  }
  resubTallies();
  render();
}
boot();
})();
</script>
